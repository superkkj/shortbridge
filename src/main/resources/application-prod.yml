spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      data-source-properties:
        stringtype: unspecified
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  rabbitmq:
    addresses: ${RABBITMQ_URL}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "${BASE_URL:https://shortbridge.duckdns.org}/login/oauth2/code/{registrationId}"

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

shortbridge:
  connect:
    base-url: ${BASE_URL:https://shortbridge.duckdns.org}
    youtube:
      client-id: ${YOUTUBE_CLIENT_ID}
      client-secret: ${YOUTUBE_CLIENT_SECRET}
    tiktok:
      client-id: ${TIKTOK_CLIENT_KEY}
      client-secret: ${TIKTOK_CLIENT_SECRET}
      redirect-uri: ${TIKTOK_REDIRECT_URI:${BASE_URL:https://shortbridge.duckdns.org}/connect/tiktok/callback}
    instagram:
      client-id: ${INSTAGRAM_CLIENT_ID:not-set-yet}
      client-secret: ${INSTAGRAM_CLIENT_SECRET:not-set-yet}
      redirect-uri: ${INSTAGRAM_REDIRECT_URI:${BASE_URL:https://shortbridge.duckdns.org}/connect/instagram/callback}
      api-base-url: ${INSTAGRAM_API_BASE_URL:https://graph.facebook.com/v23.0}
      scopes:
        - pages_show_list
        - pages_read_engagement
        - instagram_basic
        - instagram_content_publish
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      base-dir: ${STORAGE_LOCAL_BASE:/tmp/shortbridge-storage}
      public-base-url: ${STORAGE_LOCAL_PUBLIC_URL:${BASE_URL:https://shortbridge.duckdns.org}/files}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:auto}
      bucket: ${S3_BUCKET:shortbridge}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style-access: ${S3_PATH_STYLE:true}
      presigned-url-ttl-seconds: 3600
  security:
    token-cipher:
      keys:
        v1: ${TOKEN_KEY_V1}
      active-key-version: v1
  publish:
    scheduler:
      fixed-delay-ms: 10000
      batch-size: 20
    feature-flags:
      youtube-enabled: ${YOUTUBE_ENABLED:true}
      instagram-enabled: ${INSTAGRAM_ENABLED:false}
      tiktok-enabled: ${TIKTOK_ENABLED:true}
  oauth:
    success-redirect-url: /dashboard

logging:
  level:
    root: INFO
    com.shortbridge: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
