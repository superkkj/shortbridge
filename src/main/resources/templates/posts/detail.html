<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(title='게시물 상세 · ShortBridge', content=~{::section})}">
<body>
<section>
  <div class="mb-3">
    <a th:href="@{/posts}" class="text-muted small text-decoration-none">
      <i class="bi bi-arrow-left"></i> 목록으로
    </a>
  </div>

  <div class="sb-page-head">
    <div>
      <h1 th:text="${post.title}">제목</h1>
      <div class="sb-subtitle">
        <span th:text="${post.publishMode}">NOW</span>
        ·
        <span th:if="${post.createdAt != null}" th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm', 'Asia/Seoul')}">-</span>
      </div>
    </div>
    <span class="badge fs-6 px-3 py-2"
          th:classappend="${post.status.name() == 'PUBLISHED'} ? 'bg-success' :
                          (${post.status.name() == 'FAILED'} ? 'bg-danger' :
                          (${post.status.name() == 'PARTIAL_FAILED'} ? 'bg-warning text-dark' : 'bg-info'))"
          th:text="${post.status}">QUEUED</span>
  </div>

  <!-- TikTok 공개 전환 안내 (TikTok 타깃 PUBLISHED 시) -->
  <div th:each="t : ${post.targets}" th:if="${t.platform.name() == 'TIKTOK' and t.status.name() == 'PUBLISHED'}"
       class="alert alert-info d-flex align-items-start gap-2">
    <i class="bi bi-info-circle-fill mt-1"></i>
    <div>
      <strong>TikTok 발행 완료 (현재 자기만 보기)</strong>
      <div class="small mt-1">
        ShortBridge 는 audit 통과 전이라 모든 TikTok 영상이 강제로 <code>SELF_ONLY</code> 로 업로드됩니다.
        대중에게 공개하려면 <strong>TikTok 앱 → 프로필 → 해당 영상 → ··· → "Privacy" → "Everyone"</strong> 으로 직접 변경해 주세요.
      </div>
    </div>
  </div>

  <!-- 게시물 정보 -->
  <div class="card mb-3">
    <div class="card-header"><i class="bi bi-info-square"></i> 게시물 정보</div>
    <div class="card-body">
      <dl class="row mb-0">
        <dt class="col-sm-3 text-muted">설명</dt>
        <dd class="col-sm-9" th:text="${post.description} ?: '-'">-</dd>
        <dt class="col-sm-3 text-muted">예약 시각</dt>
        <dd class="col-sm-9">
          <span th:if="${post.scheduledAt != null}" th:text="${#temporals.format(post.scheduledAt, 'yyyy-MM-dd HH:mm', 'Asia/Seoul') + ' KST'}">-</span>
          <span th:if="${post.scheduledAt == null}" class="text-muted">없음 (즉시 발행)</span>
        </dd>
        <dt class="col-sm-3 text-muted">해시태그</dt>
        <dd class="col-sm-9">
          <span th:if="${post.hashtags != null and !#lists.isEmpty(post.hashtags)}">
            <span th:each="h : ${post.hashtags}" class="badge bg-secondary me-1" th:text="|#${h}|">#tag</span>
          </span>
          <span th:if="${post.hashtags == null or #lists.isEmpty(post.hashtags)}" class="text-muted">-</span>
        </dd>
      </dl>
    </div>
  </div>

  <!-- 플랫폼별 발행 상태 -->
  <div class="card">
    <div class="card-header"><i class="bi bi-broadcast"></i> 플랫폼별 발행 상태</div>
    <div class="card-body p-0">
      <div class="table-responsive">
      <table class="table mb-0">
        <thead>
          <tr>
            <th>플랫폼</th><th>상태</th><th>외부 ID</th><th>에러</th><th>재시도</th><th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="t : ${post.targets}">
            <td><span class="badge bg-secondary" th:text="${t.platform}">YOUTUBE</span></td>
            <td>
              <span class="badge"
                    th:classappend="${t.status.name() == 'PUBLISHED'} ? 'bg-success' :
                                    (${t.status.name() == 'FAILED_PERMANENT'} ? 'bg-danger' :
                                    (${t.status.name() == 'FAILED_TEMPORARY'} ? 'bg-warning text-dark' :
                                    (${t.status.name() == 'BLOCKED_BY_CAPABILITY'} ? 'bg-danger' : 'bg-info')))"
                    th:text="${t.status}">QUEUED</span>
            </td>
            <td class="text-muted small" th:text="${t.externalPostId} ?: '-'">-</td>
            <td class="text-danger small" th:text="${t.errorMessage} ?: '-'">-</td>
            <td class="small" th:text="${t.retryCount}">0</td>
            <td>
              <button type="button" class="btn btn-sm btn-outline-primary js-retry"
                      th:if="${t.status.name() == 'FAILED_TEMPORARY' or t.status.name() == 'RETRY_WAIT' or t.status.name() == 'RECONNECT_REQUIRED'}"
                      th:data-id="${t.id}">
                <i class="bi bi-arrow-clockwise"></i> 재시도
              </button>
            </td>
          </tr>
        </tbody>
      </table>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
      const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
      document.querySelectorAll('.js-retry').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const headers = {};
          if (csrfHeader && csrfToken) headers[csrfHeader] = csrfToken;
          const res = await fetch('/api/v1/posts/targets/' + id + '/retry', { method: 'POST', headers });
          if (res.ok) location.reload();
          else alert((await res.json()).message || '실패');
        });
      });
    })();
  </script>
</section>
</body>
</html>
