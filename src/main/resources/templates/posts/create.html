<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(title='새 게시물 · ShortBridge', content=~{::section})}">
<body>
<section>
  <div class="sb-page-head">
    <div>
      <h1>새 게시물 만들기</h1>
      <div class="sb-subtitle">영상 1개로 여러 플랫폼에 동시 발행</div>
    </div>
  </div>

  <div th:if="${#lists.isEmpty(videos)}" class="alert alert-warning d-flex align-items-start gap-2">
    <i class="bi bi-exclamation-triangle-fill mt-1"></i>
    <div>
      <strong>영상이 없습니다</strong>
      <div class="small mt-1">
        먼저 영상을 업로드해 주세요.
        <a th:href="@{/videos/new}" class="btn btn-sm btn-warning ms-2">
          <i class="bi bi-cloud-upload"></i> 영상 업로드
        </a>
      </div>
    </div>
  </div>
  <div th:if="${#lists.isEmpty(socialAccounts)}" class="alert alert-warning d-flex align-items-start gap-2">
    <i class="bi bi-exclamation-triangle-fill mt-1"></i>
    <div>
      <strong>연결된 플랫폼이 없습니다</strong>
      <div class="small mt-1">
        먼저 발행할 플랫폼을 연결해 주세요.
        <a th:href="@{/social-accounts}" class="btn btn-sm btn-warning ms-2">
          <i class="bi bi-link-45deg"></i> 플랫폼 연결
        </a>
      </div>
    </div>
  </div>

  <form id="post-form" class="card card-body" th:if="${not #lists.isEmpty(videos) and not #lists.isEmpty(socialAccounts)}">
    <div class="mb-3">
      <label class="form-label">영상</label>
      <select name="videoId" class="form-select" required>
        <option value="">선택하세요</option>
        <option th:each="v : ${videos}" th:value="${v.id}"
                th:text="${v.originalFileName + ' · ' + v.durationSeconds + 's · 업로드 ' + #temporals.format(v.createdAt, 'yyyy-MM-dd HH:mm', 'Asia/Seoul')}">영상</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">제목</label>
      <input type="text" name="title" class="form-control" maxlength="255" required>
    </div>
    <div class="mb-3">
      <label class="form-label">설명</label>
      <textarea name="description" class="form-control" rows="3" maxlength="5000"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">해시태그 (쉼표 구분)</label>
      <input type="text" name="hashtags" class="form-control" placeholder="shorts, reels, viral">
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold mb-2">발행 대상</label>
      <div class="sb-platform-grid">
        <label th:each="acc : ${socialAccounts}"
               class="sb-platform-card"
               th:classappend="'sb-platform-' + ${#strings.toLowerCase(acc.platform.name())}">
          <input type="checkbox" class="sb-platform-input" name="targets" th:value="${acc.platform}">
          <span class="sb-platform-icon">
            <i class="bi"
               th:classappend="${acc.platform.name() == 'YOUTUBE'} ? 'bi-youtube' :
                               (${acc.platform.name() == 'INSTAGRAM'} ? 'bi-instagram' : 'bi-tiktok')"></i>
          </span>
          <span class="sb-platform-meta">
            <span class="sb-platform-name" th:text="${acc.platform}">PLATFORM</span>
            <span class="sb-platform-account" th:text="${acc.displayName}">@account</span>
            <span class="sb-platform-note" th:if="${acc.platform.name() == 'TIKTOK'}">
              <i class="bi bi-info-circle"></i> 자기만 보기로 업로드됩니다
            </span>
          </span>
          <span class="sb-platform-check">
            <i class="bi bi-check-circle-fill"></i>
          </span>
        </label>
      </div>
      <div class="form-text mt-2">카드를 눌러 발행할 플랫폼을 선택하세요. 여러 개 동시 선택 가능합니다.</div>
    </div>
    <div class="mb-3">
      <label class="form-label">발행 모드</label>
      <select name="publishMode" id="publishMode" class="form-select">
        <option value="NOW">즉시 발행</option>
        <option value="SCHEDULED">예약 발행</option>
        <option value="DRAFT">임시 저장</option>
      </select>
    </div>
    <div class="mb-3" id="scheduled-at-group" style="display:none;">
      <label class="form-label">예약 시각 (UTC ISO)</label>
      <input type="datetime-local" name="scheduledAt" class="form-control">
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-send"></i> 만들기
      </button>
      <a th:href="@{/posts}" class="btn btn-outline-secondary">취소</a>
    </div>
    <div id="result" class="mt-3"></div>
  </form>

  <script>
    (function () {
      const form = document.getElementById('post-form');
      if (!form) return;
      const mode = document.getElementById('publishMode');
      const group = document.getElementById('scheduled-at-group');
      mode.addEventListener('change', () => { group.style.display = mode.value === 'SCHEDULED' ? '' : 'none'; });

      const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
      const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const data = new FormData(form);
        const targets = data.getAll('targets');
        const hashtags = (data.get('hashtags') || '').split(',').map(s => s.trim()).filter(Boolean);
        const payload = {
          videoId: data.get('videoId'),
          title: data.get('title'),
          description: data.get('description'),
          hashtags: hashtags,
          publishMode: data.get('publishMode'),
          scheduledAt: data.get('scheduledAt') ? new Date(data.get('scheduledAt')).toISOString() : null,
          targets: targets
        };
        const headers = { 'Content-Type': 'application/json' };
        if (csrfHeader && csrfToken) headers[csrfHeader] = csrfToken;

        const res = await fetch('/api/v1/posts', { method: 'POST', headers, body: JSON.stringify(payload) });
        const body = await res.json();
        const result = document.getElementById('result');
        if (res.ok) {
          result.innerHTML = '<div class="alert alert-success">게시물이 생성되었습니다.</div>';
          setTimeout(() => { location.href = '/posts/' + body.id; }, 600);
        } else {
          result.innerHTML = '<div class="alert alert-danger">' + (body.message || '실패') + '</div>';
        }
      });
    })();
  </script>
</section>
</body>
</html>
