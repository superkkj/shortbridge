<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · ShortBridge</title>
  <script>
    (function () {
      var saved = localStorage.getItem('sb-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; }
    .sb-login-bg {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #eef2ff 0%, #fce7f3 100%);
      z-index: -1;
    }
    [data-theme="dark"] .sb-login-bg {
      background: linear-gradient(135deg, #1e1b4b 0%, #3b0d2e 100%);
    }
    [data-theme="dark"] .btn-google {
      background: var(--sb-surface);
      color: var(--sb-text);
      border-color: var(--sb-border);
    }
    [data-theme="dark"] .btn-google:hover { background: var(--sb-surface-alt); }
  </style>
</head>
<body>
<div class="sb-login-bg"></div>
<div class="container">
  <div class="card sb-login-card">
    <div class="sb-login-hero">
      <div class="sb-logo"><i class="bi bi-broadcast"></i></div>
      <h1 class="h3 mb-1 fw-bold">ShortBridge</h1>
      <p class="mb-0 small" style="opacity:.92;">영상 1개로 모든 숏폼 플랫폼에 동시 발행</p>
    </div>
    <div class="sb-login-body">

      <div th:if="${param.error}" class="alert alert-danger small">
        <i class="bi bi-exclamation-triangle"></i>
        로그인에 실패했습니다. 다시 시도해 주세요.
      </div>
      <div th:if="${param.logout}" class="alert alert-success small">
        <i class="bi bi-check-circle"></i>
        로그아웃 되었습니다.
      </div>

      <div class="d-grid">
        <a class="btn-google" th:href="@{/oauth2/authorization/google}">
          <img src="https://www.google.com/favicon.ico" alt="Google"/>
          Google 로 시작하기
        </a>
      </div>

      <div class="d-flex align-items-center my-4">
        <hr class="flex-grow-1"/>
        <span class="text-muted small px-3">지원 플랫폼</span>
        <hr class="flex-grow-1"/>
      </div>

      <div class="d-flex justify-content-around text-center text-muted small">
        <div>
          <i class="bi bi-youtube fs-3 text-danger d-block"></i>
          YouTube
        </div>
        <div>
          <i class="bi bi-instagram fs-3 d-block" style="color:#e1306c;"></i>
          Instagram
        </div>
        <div>
          <i class="bi bi-tiktok fs-3 d-block"></i>
          TikTok
        </div>
      </div>

      <div class="text-muted small mt-4 text-center">
        <i class="bi bi-shield-check"></i>
        Google 계정으로 안전하게 로그인합니다. 플랫폼별 계정은 로그인 후 별도로 연결합니다.
      </div>
    </div>
  </div>
</div>
</body>
</html>
