<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · ShortBridge</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-body-tertiary">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <i class="bi bi-broadcast display-4 text-primary"></i>
            <h1 class="h3 mt-2">ShortBridge</h1>
            <p class="text-muted small mb-0">영상 1개 업로드 → 4개 플랫폼 동시 발행</p>
          </div>

          <div th:if="${param.error}" class="alert alert-danger small">
            <i class="bi bi-exclamation-triangle"></i>
            로그인에 실패했습니다.
          </div>
          <div th:if="${param.logout}" class="alert alert-success small">
            로그아웃 되었습니다.
          </div>

          <div class="d-grid gap-2 mt-3">
            <a class="btn btn-outline-dark btn-lg" th:href="@{/oauth2/authorization/google}">
              <i class="bi bi-google"></i> Google 로 시작하기
            </a>
          </div>

          <div class="text-muted small mt-4">
            <i class="bi bi-info-circle"></i>
            Instagram / TikTok 등 플랫폼 계정은 로그인 후 "플랫폼 연결" 메뉴에서 별도 연결합니다.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
