<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(title='새 영상 · ShortBridge', content=~{::section})}">
<body>
<section>
  <h1 class="h4 mb-3">새 영상 업로드 + 자동 발행</h1>

  <div class="alert alert-info small">
    <i class="bi bi-info-circle"></i>
    파일을 올리면 <strong>연결된 모든 플랫폼</strong>에 즉시 자동 발행됩니다.
    세밀하게 조절하려면 <a th:href="@{/posts/new}">/posts/new</a> 화면을 이용하세요.
  </div>

  <div class="card">
    <div class="card-body">
      <form id="upload-form" enctype="multipart/form-data">
        <div class="mb-3">
          <label class="form-label">영상 파일</label>
          <input type="file" name="file" accept="video/mp4" class="form-control" required>
          <div class="form-text">
            MP4 / H.264 / AAC · 140초 이하 · 512MB 이하 · 세로형 또는 정사각형 권장
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">제목 (생략하면 파일명 사용)</label>
          <input type="text" name="title" class="form-control" maxlength="255" placeholder="(선택) 게시 제목">
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" id="onlyUpload" class="form-check-input">
          <label for="onlyUpload" class="form-check-label small text-muted">
            저장만 하고 자동 발행하지 않기
          </label>
        </div>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-cloud-upload"></i> 업로드 + 자동 발행
        </button>
        <a th:href="@{/videos}" class="btn btn-outline-secondary">취소</a>
      </form>

      <div id="upload-result" class="mt-3"></div>
    </div>
  </div>

  <script>
    (function () {
      const form = document.getElementById('upload-form');
      const result = document.getElementById('upload-result');
      const onlyUpload = document.getElementById('onlyUpload');
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        result.innerHTML = '<div class="text-muted"><div class="spinner-border spinner-border-sm"></div> 업로드 중...</div>';
        const formData = new FormData(form);
        if (onlyUpload.checked) formData.delete('title');
        const endpoint = onlyUpload.checked ? '/api/v1/videos' : '/api/v1/videos/quick-publish';
        try {
          const res = await fetch(endpoint, { method: 'POST', body: formData });
          const body = await res.json();
          if (res.ok) {
            if (onlyUpload.checked) {
              result.innerHTML = '<div class="alert alert-success">업로드 완료 · ID ' + body.id + '</div>';
              setTimeout(() => { location.href = '/videos'; }, 800);
            } else {
              result.innerHTML = '<div class="alert alert-success">업로드 + 자동 발행 시작! · 게시물 ID ' + body.id + '</div>';
              setTimeout(() => { location.href = '/posts/' + body.id; }, 800);
            }
          } else {
            result.innerHTML = '<div class="alert alert-danger">' + (body.message || '업로드 실패') + '</div>';
          }
        } catch (err) {
          result.innerHTML = '<div class="alert alert-danger">' + err.message + '</div>';
        }
      });
    })();
  </script>
</section>
</body>
</html>
