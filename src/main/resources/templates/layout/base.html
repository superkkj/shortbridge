<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} ?: 'ShortBridge'">ShortBridge</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <meta name="_csrf" th:content="${_csrf?.token}"/>
  <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
      <i class="bi bi-broadcast"></i> ShortBridge
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">대시보드</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/videos}">영상</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/posts}">게시물</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/social-accounts}">플랫폼 연결</a></li>
      </ul>
      <ul class="navbar-nav" sec:authorize="isAuthenticated()">
        <li class="nav-item">
          <form th:action="@{/logout}" method="post" class="d-inline">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-outline-light btn-sm">
              <i class="bi bi-box-arrow-right"></i> 로그아웃
            </button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div th:replace="${content}">기본 컨텐츠</div>
</main>

<footer class="py-3 text-center text-muted small">
  <span>ShortBridge &middot; 숏폼 멀티 업로드</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
