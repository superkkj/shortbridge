<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오류 · ShortBridge</title>
  <script>
    (function () {
      var saved = localStorage.getItem('sb-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body style="min-height:100vh; display:flex; align-items:center;">
<div class="container">
  <div class="card mx-auto" style="max-width: 480px;">
    <div class="card-body text-center p-5">
      <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 3.5rem;"></i>
      <h1 class="h2 mt-3 mb-1" th:text="${status} ?: '오류'">500</h1>
      <p class="text-muted" th:text="${error} ?: '예상치 못한 문제가 발생했습니다'">오류</p>
      <p class="small text-muted" th:if="${message}" th:text="${message}"></p>
      <div class="d-flex gap-2 justify-content-center mt-4">
        <a th:href="@{/dashboard}" class="btn btn-primary">
          <i class="bi bi-house"></i> 대시보드
        </a>
        <button type="button" class="btn btn-outline-secondary" onclick="history.back()">
          <i class="bi bi-arrow-left"></i> 이전 페이지
        </button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
