name: shortbridge-nas

services:
  traefik:
    image: traefik:v2.11
    container_name: ${TRAEFIK_NAME:-shortbridge-traefik}
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:8080
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
    ports:
      - "${SHORTBRIDGE_HTTP_PORT:-8080}:8080"
      - "${TRAEFIK_API_PORT:-8081}:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - shortbridge-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: shortbridge-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-shortbridge}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - shortbridge-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shortbridge-net

networks:
  shortbridge-net:
    name: ${SHORTBRIDGE_NETWORK:-shortbridge-nas-net}

volumes:
  shortbridge-rabbitmq-data:
