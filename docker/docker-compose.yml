services:
  postgres:
    image: postgres:16
    container_name: shortbridge-postgres
    environment:
      POSTGRES_DB: shortbridge
      POSTGRES_USER: shortbridge
      POSTGRES_PASSWORD: shortbridge
    ports:
      - "5432:5432"
    volumes:
      - shortbridge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: shortbridge-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: shortbridge
      RABBITMQ_DEFAULT_PASS: shortbridge
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: shortbridge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9900:9000"
      - "9901:9001"
    volumes:
      - shortbridge-miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/shortbridge || true &&
      mc anonymous set download local/shortbridge || true &&
      echo 'minio bucket ready'
      "

volumes:
  shortbridge-pgdata:
  shortbridge-miniodata:
