name: NAS Docker Blue-Green Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}
  DOCKER_PLATFORMS: ${{ vars.NAS_DOCKER_PLATFORMS || 'linux/amd64,linux/arm64' }}
  NAS_SSH_PORT: ${{ secrets.NAS_SSH_PORT || '22' }}
  NAS_DEPLOY_PATH: ${{ secrets.NAS_DEPLOY_PATH || '/volume1/docker/shortbridge-nas' }}

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "This workflow is for Docker-capable NAS/server targets."
          echo "Synology DS118 does not support Docker/Container Manager."
          echo "Use deploy-nas-jar.yml for the current DS118 runtime."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - run: gradle test --no-daemon

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Prepare SSH
        run: |
          test -n "${NAS_SSH_HOST}"
          test -n "${NAS_SSH_USER}"
          test -n "${NAS_SSH_KEY}"
          mkdir -p ~/.ssh
          printf '%s\n' "${NAS_SSH_KEY}" > ~/.ssh/nas_key
          chmod 600 ~/.ssh/nas_key
          ssh-keyscan -p "${NAS_SSH_PORT}" "${NAS_SSH_HOST}" >> ~/.ssh/known_hosts
        env:
          NAS_SSH_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_SSH_USER: ${{ secrets.NAS_SSH_USER }}
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}

      - name: Upload deploy files
        run: |
          tar -czf /tmp/shortbridge-nas-deploy.tgz \
            scripts/deploy-nas-blue-green.sh \
            docker/nas/docker-compose.yml \
            docker/nas/.env.nas.example
          ssh -i ~/.ssh/nas_key -p "${NAS_SSH_PORT}" "${NAS_SSH_USER}@${NAS_SSH_HOST}" \
            "mkdir -p '${NAS_DEPLOY_PATH}'"
          scp -i ~/.ssh/nas_key -P "${NAS_SSH_PORT}" /tmp/shortbridge-nas-deploy.tgz \
            "${NAS_SSH_USER}@${NAS_SSH_HOST}:${NAS_DEPLOY_PATH}/shortbridge-nas-deploy.tgz"
          ssh -i ~/.ssh/nas_key -p "${NAS_SSH_PORT}" "${NAS_SSH_USER}@${NAS_SSH_HOST}" \
            "cd '${NAS_DEPLOY_PATH}' && tar -xzf shortbridge-nas-deploy.tgz && chmod +x scripts/deploy-nas-blue-green.sh"
        env:
          NAS_SSH_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_SSH_USER: ${{ secrets.NAS_SSH_USER }}

      - name: Deploy on NAS
        run: |
          ssh -i ~/.ssh/nas_key -p "${NAS_SSH_PORT}" "${NAS_SSH_USER}@${NAS_SSH_HOST}" \
            "cd '${NAS_DEPLOY_PATH}' && REGISTRY='${REGISTRY}' IMAGE_NAME='${IMAGE_NAME}' TAG='${IMAGE_TAG}' GHCR_USER='${GHCR_USER}' GHCR_TOKEN='${GHCR_TOKEN}' ./scripts/deploy-nas-blue-green.sh"
        env:
          NAS_SSH_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_SSH_USER: ${{ secrets.NAS_SSH_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
